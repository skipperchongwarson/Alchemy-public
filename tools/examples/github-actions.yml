name: Voice DNA

on:
  pull_request:
  push:

jobs:
  lint-writing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check Markdown
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            python tools/voice_dna_refiner.py "$file" \
              --config tools/voice-dna-config.json \
              --check --quiet || status=$?
          done < <(find . -name '*.md' -not -path './.git/*' -print0)
          exit "$status"
